<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — BeegDee Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="navbar"></header>

  <main>
    <div class="container">
      <div class="card auth-card">
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to your account to continue.</p>

        <div id="form-error" class="alert alert-error" style="display:none;"></div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-field">
              <input type="password" id="password" name="password" placeholder="Your password" required autocomplete="current-password">
              <button type="button" class="password-toggle" aria-label="Show password"></button>
            </div>
          </div>
          <button type="submit" id="submit-btn" class="btn btn-primary btn-block">Sign in</button>
        </form>

        <p class="alt-action">Don't have an account? <a href="register.html">Create one</a></p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">© 2026 BeegDee Store. All rights reserved.</div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('form-error');
    const submitBtn = document.getElementById('submit-btn');

    initPasswordToggles();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      errorEl.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';

      try {
        const res = await API.post('/auth/login', { email, password });
        saveSession(res.data.token, res.data.user);
        if (res.data.user.role === 'admin') {
          window.location.href = 'admin/dashboard.html';
        } else {
          window.location.href = 'index.html';
        }
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
