<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin dashboard — BeegDee Store</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <header id="navbar"></header>

  <main>
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <div class="admin-title">Store admin</div>
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="products.html">Products</a>
        <a href="add-product.html">Add product</a>
        <a href="orders.html">Orders</a>
        <a href="users.html">Users</a>
        <a href="../index.html">← Back to store</a>
      </aside>

      <div class="admin-content">
        <div class="admin-header">
          <h1>Dashboard</h1>
          <a href="add-product.html" class="btn btn-primary">+ Add product</a>
        </div>

        <div id="stats-grid" class="stats-grid">
          <div class="spinner"></div>
        </div>

        <div class="dash-panels">
          <div class="dash-panel">
            <h2>Low stock products</h2>
            <div id="low-stock"><div class="spinner"></div></div>
          </div>
          <div class="dash-panel">
            <h2>Recent orders</h2>
            <div id="recent-orders"><div class="spinner"></div></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">© 2026 BeegDee Store. All rights reserved.</div>
  </footer>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin/dashboard.js"></script>
</body>
</html>
