<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add product — BeegDee Store</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <header id="navbar"></header>

  <main>
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <div class="admin-title">Store admin</div>
        <a href="dashboard.html">Dashboard</a>
        <a href="products.html">Products</a>
        <a href="add-product.html" class="active">Add product</a>
        <a href="orders.html">Orders</a>
        <a href="users.html">Users</a>
        <a href="../index.html">← Back to store</a>
      </aside>

      <div class="admin-content">
        <div class="admin-header">
          <h1>Add product</h1>
        </div>

        <form id="add-product-form" class="product-form" novalidate>
          <div class="form-group">
            <label for="name">Product name</label>
            <input type="text" id="name" name="name" placeholder="e.g. Wireless Headphones" required>
          </div>

          <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" placeholder="Describe the product…" required></textarea>
          </div>

          <div class="form-group">
            <label for="price">Price (₦)</label>
            <input type="number" id="price" name="price" placeholder="0.00" min="0" step="0.01" required>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <input type="text" id="category" name="category" list="category-options" placeholder="e.g. Electronics" required>
            <datalist id="category-options"></datalist>
            <p class="hint">Pick an existing category or type a new one.</p>
          </div>

          <div class="form-group">
            <label for="stock">Stock quantity</label>
            <input type="number" id="stock" name="stock" placeholder="0" min="0" step="1" required>
          </div>

          <div class="form-group">
            <label for="image">Product image</label>
            <input type="file" id="image" name="image" accept="image/*">
            <div id="image-preview" class="image-preview">No image selected</div>
          </div>

          <div class="form-actions">
            <button type="submit" id="submit-btn" class="btn btn-primary">Add product</button>
            <a href="products.html" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">© 2026 BeegDee Store. All rights reserved.</div>
  </footer>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin/add-product.js"></script>
</body>
</html>
